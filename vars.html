<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
<title data-i18n="变量表">变量表</title>
<style>
    :root { color-scheme: light; --line:#e3e9f3; --ink:#1f2a37; --muted:#7b8798; --brand:#2f6fed; }
    * { box-sizing: border-box; }
    body { margin:0; background:#f6f8fc; color:var(--ink); font:15px/1.75 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    header {
        position: sticky; top: 0; z-index: 20; background: #fff;
        border-bottom: 1px solid var(--line); padding: 10px 22px;
        display: flex; align-items: center; gap: 10px;
    }
    header h1 { font-size: 15px; margin: 0; }
    header .status { flex: 1; font-size: 12.5px; color: var(--muted); }
    button {
        font: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer;
        border: 1px solid var(--line); background: #f7f9fd; border-radius: 8px; color: var(--ink);
    }
    button:hover { background: #eef3fc; }

    main { max-width: 1040px; margin: 0 auto; padding: 20px 22px 90px; }
    .group { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px 6px; margin:0 0 16px; }
    .group h2 { font-size:15px; margin:0 0 2px; }
    .group .gdesc { margin:0 0 12px; color:var(--muted); font-size:12.5px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; font-weight:600; color:#5b6b80; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
    td { padding:8px; border-bottom:1px solid #f0f3f9; vertical-align:top; }
    tr:last-child td { border-bottom:none; }
    code { font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#f4f7fd; color:#2b5aa8; padding:2px 6px; border-radius:6px; cursor:pointer; }
    code:hover { background:#e8f0ff; }
    .ex { color:#3f6b3f; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; }
    .src { color:#6b7789; font-size:12.5px; }
    .empty { color:#a1581a; font-size:12px; }
    .syntax td.code { width:44%; }
    .syntax td.code code { display:inline-block; word-break:break-all; }
    .res { color:#3f6b3f; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
    .legal { margin-top:32px; padding-top:18px; border-top:1px solid var(--line); font-size:12.5px; line-height:1.75; color:#6b7789; }
    .legal-sec { margin-bottom:12px; }
    .legal h3 { font-size:12.5px; margin:0 0 4px; color:#48566a; font-weight:600; }
    .legal p { margin:0; }
    @media (max-width:640px) { td.src, th.src { display:none; } }
</style>
</head>
<body data-title-key="vars.title">
<header>
    <h1 data-i18n="vars.title">变量表</h1>
    <span class="status" id="status"></span>
    <button type="button" onclick="copyAll()" data-i18n="vars.copyAll">复制全部</button>
</header>

<main>
    <div id="groups"></div>

    <footer class="legal">
        <div class="legal-sec">
            <h3 data-i18n="legal.privacy">隐私</h3>
            <p data-i18n="legal.privacyBody">本工具完全在你的浏览器本地运行：所有文件读取、编辑与编译都在本机完成，不会上传任何内容，也不含统计或追踪脚本。语言偏好保存在浏览器 localStorage 中，可随时清除站点数据移除。</p>
        </div>
        <div class="legal-sec">
            <h3 data-i18n="legal.disclaimer">免责声明</h3>
            <p data-i18n="legal.disclaimerBody">本工具按“现状”提供，不保证适用于任何特定用途。配置由你自行编辑、编译与应用，由此产生的任何后果由使用者承担；作者不对数据丢失、站点异常或任何间接损失负责。使用前请自行备份配置文件。</p>
        </div>
    </footer>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/vars.js"></script>
<script>
const en = () => PetI18n.lang === 'en';
const T = (item, field) => PetVars.text(item, field, PetI18n.lang);

function renderSyntax(host) {
    const items = (PetVars.syntax || []);
    if (!items.length) return;

    const box = document.createElement('section');
    box.className = 'group syntax';
    const h = document.createElement('h2');
    h.textContent = en() ? 'Syntax' : '写法';
    const d = document.createElement('p');
    d.className = 'gdesc';
    d.textContent = en()
        ? 'Braces hold a small expression. The examples assume pet=Whale, title="An article title", tag empty.'
        : '花括号里是"小表达式"。下表的示例假设 pet=小鲸、title=一篇文章的标题、tag 为空。';
    box.append(h, d);

    const table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>' + (en() ? 'Expression' : '写法') + '</th>' +
        '<th>' + (en() ? 'Meaning' : '含义') + '</th>' +
        '<th>' + (en() ? 'Result' : '示例结果') + '</th></tr></thead>';
    const body = document.createElement('tbody');
    for (const s of items) {
        const tr = document.createElement('tr');

        const td1 = document.createElement('td');
        td1.className = 'code';
        const code = document.createElement('code');
        code.textContent = s.code;
        code.title = en() ? 'Click to copy' : '点击复制';
        code.onclick = () => {
            navigator.clipboard.writeText(s.code).catch(() => {});
            code.style.background = '#d8e7ff';
            setTimeout(() => { code.style.background = ''; }, 400);
        };
        td1.appendChild(code);

        const td2 = document.createElement('td');
        td2.textContent = en() ? s.en : s.zh;

        const td3 = document.createElement('td');
        td3.className = 'res';
        /* 示例结果里含示例人名与演示文案，切英文时也一并换掉 */
    td3.textContent = (window.PetI18n && PetI18n.lang === 'en') ? (s.resultEn || s.result) : s.result;

        tr.append(td1, td2, td3);
        body.appendChild(tr);
    }
    table.appendChild(body);
    box.appendChild(table);
    host.appendChild(box);
}

function renderGroups(host) {
    for (const g of PetVars.groups) {
        const items = PetVars.list.filter((v) => v.group === g.id);
        if (!items.length) continue;

        const box = document.createElement('section');
        box.className = 'group';
        const h = document.createElement('h2');
        h.textContent = en() ? g.en : g.zh;
        const d = document.createElement('p');
        d.className = 'gdesc';
        d.textContent = en() ? g.desc.en : g.desc.zh;
        box.append(h, d);

        const table = document.createElement('table');
        table.innerHTML = '<thead><tr>' +
            '<th>' + (en() ? 'Variable' : '变量') + '</th>' +
            '<th>' + (en() ? 'Meaning' : '含义') + '</th>' +
            '<th>' + (en() ? 'Example' : '示例') + '</th>' +
            '<th class="src">' + (en() ? 'Source' : '取值来源') + '</th>' +
            '</tr></thead>';

        const body = document.createElement('tbody');
        for (const v of items) {
            const tr = document.createElement('tr');

            const td1 = document.createElement('td');
            const code = document.createElement('code');
            code.textContent = '{' + v.key + '}';
            code.title = en() ? 'Click to copy' : '点击复制';
            code.onclick = () => {
                navigator.clipboard.writeText('{' + v.key + '}').catch(() => {});
                code.style.background = '#d8e7ff';
                setTimeout(() => { code.style.background = ''; }, 400);
            };
            td1.appendChild(code);

            const td2 = document.createElement('td');
            td2.textContent = en() ? v.en : v.zh;
            const empty = T(v, 'empty');
            if (empty) {
                const e = document.createElement('div');
                e.className = 'empty';
                e.textContent = (en() ? 'Empty: ' : '为空：') + empty;
                td2.appendChild(e);
            }

            const td3 = document.createElement('td');
            td3.className = 'ex';
            td3.textContent = T(v, 'ex');

            const td4 = document.createElement('td');
            td4.className = 'src';
            td4.textContent = T(v, 'src');

            tr.append(td1, td2, td3, td4);
            body.appendChild(tr);
        }
        table.appendChild(body);
        box.appendChild(table);
        host.appendChild(box);
    }
}

function render() {
    const host = document.getElementById('groups');
    host.textContent = '';
    renderSyntax(host);
    renderGroups(host);
    const st = document.getElementById('status');
    if (st) {
        st.textContent = en()
            ? PetVars.list.length + ' placeholders · click a name to copy'
            : PetVars.list.length + T(' 个占位符 · 点变量名复制');
    }
}

function copyAll() {
    const text = PetVars.list.map((v) => '{' + v.key + '}').join('  ');
    navigator.clipboard.writeText(text).catch(() => {});
}

PetI18n.onChange(() => render());
render();
</script>
</body>
</html>
