<style>
    :root { color-scheme: light; --line:#e3e9f3; --ink:#1f2a37; --muted:#7b8798; --brand:#2f6fed; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f6f8fc; color:var(--ink); font:15px/1.75 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    header { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:10px 22px; display:flex; gap:14px; align-items:center; }
    header a { color:var(--muted); text-decoration:none; font-size:13px; padding:5px 10px; border-radius:7px; }
    header a:hover { background:#f1f5fc; color:var(--ink); }
    header a.on { background:#e8f0ff; color:#2a4f9b; font-weight:600; }
    header .sp { flex:1; }
    main { max-width:820px; margin:0 auto; padding:34px 24px 90px; background:#fff; }
    h1 { font-size:25px; margin:0 0 18px; padding-bottom:10px; border-bottom:1px solid var(--line); }
    h2 { font-size:19px; margin:34px 0 12px; padding-bottom:6px; border-bottom:1px solid #eef2f8; }
    h3 { font-size:16px; margin:24px 0 8px; }
    h4 { font-size:14.5px; margin:18px 0 6px; color:#3c4a5c; }
    p { margin:10px 0; }
    ul, ol { margin:10px 0; padding-left:24px; }
    li { margin:4px 0; }
    code { background:#f0f3f9; padding:1px 5px; border-radius:4px; font:13px/1.5 Consolas,monospace; color:#2b4a7a; }
    pre { background:#1e2733; color:#d9e3f2; padding:14px 16px; border-radius:10px; overflow:auto; margin:14px 0; }
    pre code { background:none; color:inherit; padding:0; font-size:12.5px; }
    table { border-collapse:collapse; width:100%; margin:14px 0; font-size:13.5px; }
    th, td { border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top; }
    th { background:#f6f9fe; font-weight:600; }
    blockquote { margin:14px 0; padding:8px 14px; border-left:3px solid #cfdcef; background:#f8fafd; color:#4a5769; }
    hr { border:0; border-top:1px solid var(--line); margin:26px 0; }
    a { color:var(--brand); }
    .err { padding:16px; background:#fff8e8; border:1px solid #f2ddb0; border-radius:10px; font-size:13.5px; }

    .legal { margin-top:36px; padding-top:18px; border-top:1px solid var(--line); font-size:12.5px; line-height:1.75; color:#6b7789; }

<script>
/* 文档清单。
 * 使用者要看的：使用说明、API 文档、交互协议。
 * 开发侧文档用 DEV-DOCS 注释块标出，
 * tools/release.js 打包时整块删除：发行包里既没有这些文件，也不会出现它们的名字。 */
const FILES = [
    'README.md'
    /* <<DEV-DOCS>> */
    , 'docs/API.md', 'docs/INTERACTION.md', 'STATUS.md', 'HANDOFF.md', 'KNOWN-ISSUES.md'
    /* <</DEV-DOCS>> */
];

const EN = {
    'README.md': 'README.en.md'
    /* <<DEV-DOCS>> */
    , 'docs/API.md': 'docs/API.en.md',
    'docs/INTERACTION.md': 'docs/INTERACTION.en.md',
    'STATUS.md': 'STATUS.en.md',
    'HANDOFF.md': 'HANDOFF.en.md',
    'KNOWN-ISSUES.md': 'KNOWN-ISSUES.en.md'
    /* <</DEV-DOCS>> */
};

function currentLang() {
    if (window.PetI18n) return PetI18n.lang;
    try { return localStorage.getItem('pet-i18n') || ((navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'); }
    catch (e) { return 'zh'; }
}

function docPath(name) {
    return currentLang() === 'en' && EN[name] ? EN[name] : name;
}

function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inline(s) {
    return s
        .replace(/`([^`]+)`/g, (m, c) => '<code>' + esc(c) + '</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
}

function render(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    const out = [];
    let i = 0;
    let inCode = false;
    let codeBuf = [];
    let tableBuf = null;
    let listBuf = null;
    let listType = 'ul';

    const flushList = () => {
        if (listBuf) { out.push('<' + listType + '>' + listBuf.join('') + '</' + listType + '>'); listBuf = null; }
    };
    const flushTable = () => {
        if (!tableBuf) return;
        const rows = tableBuf;
        let html = '<table>';
        rows.forEach((row, idx) => {
            const cells = row.split('|').slice(1, -1).map((c) => c.trim());
            if (idx === 1 && cells.every((c) => /^:?-{2,}:?$/.test(c))) return;
            const tag = idx === 0 ? 'th' : 'td';
            html += '<tr>' + cells.map((c) => '<' + tag + '>' + inline(c) + '</' + tag + '>').join('') + '</tr>';
        });
        html += '</table>';
        out.push(html);
        tableBuf = null;
    };

    while (i < lines.length) {
        let line = lines[i];

        if (/^```/.test(line)) {
            if (inCode) {
                out.push('<pre><code>' + esc(codeBuf.join('\n')) + '</code></pre>');
                codeBuf = []; inCode = false;
            } else { inCode = true; }
            i++; continue;
        }
        if (inCode) { codeBuf.push(line); i++; continue; }

        if (/^\s*\|.*\|\s*$/.test(line)) {
            flushList();
            tableBuf = tableBuf || [];
            tableBuf.push(line.trim());
            i++; continue;
        } else { flushTable(); }

        if (/^\s*$/.test(line)) { flushList(); i++; continue; }

        const h = line.match(/^(#{1,6})\s+(.*)$/);
        if (h) {
            flushList();
            out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
            i++; continue;
        }

        if (/^---+$/.test(line)) { flushList(); out.push('<hr>'); i++; continue; }

        if (/^>\s?/.test(line)) {
            flushList();
            const buf = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
            out.push('<blockquote>' + buf.map((x) => inline(x)).join('<br>') + '</blockquote>');
            continue;
        }

        const ol = line.match(/^\s*(\d+)\.\s+(.*)$/);
        const ul = line.match(/^\s*[-*]\s+(.*)$/);
        if (ol || ul) {
            const type = ol ? 'ol' : 'ul';
            if (listBuf && listType !== type) flushList();
            listType = type;
            listBuf = listBuf || [];
            listBuf.push('<li>' + inline(ol ? ol[2] : ul[1]) + '</li>');
            i++; continue;
        }

        flushList();
        const buf = [line];
        i++;
        while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6})\s/.test(lines[i])
               && !/^\s*[-*]\s/.test(lines[i]) && !/^\s*\d+\.\s/.test(lines[i])
               && !/^\s*\|/.test(lines[i]) && !/^```/.test(lines[i]) && !/^>/.test(lines[i])) {
            buf.push(lines[i]); i++;
        }
        out.push('<p>' + buf.map((x) => inline(x)).join(' ') + '</p>');
    }
    if (inCode && codeBuf.length) out.push('<pre><code>' + esc(codeBuf.join('\n')) + '</code></pre>');
    flushList();
    flushTable();
    return out.join('\n');
}

async function load(name) {
    const doc = document.getElementById('doc');
    document.querySelectorAll('header a[data-f]').forEach((a) => {
        a.classList.toggle('on', a.getAttribute('href') === '?f=' + name);
    });
    try {
        const target = docPath(name);
        const res = await fetch(target + '?ts=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = new TextDecoder('utf-8').decode(await res.arrayBuffer());
        if (/^\s*<(!doctype|html)/i.test(text)) throw new Error('这是网页而不是 Markdown');
        doc.innerHTML = render(text);
    var suffix = (window.PetI18n ? PetI18n.lang : 'zh') === 'en' ? 'Docs' : '文档';
    document.title = name.replace(/^docs\//, '').replace(/\.en\.md$/, '.md') + ' · ' + suffix;
    } catch (e) {
        doc.innerHTML = '<div class="err"><b>读不到 ' + name + '</b><br>' +
            '浏览器不允许网页读取本地文件。双击 pet-lab 目录里的 <code>start.bat</code>，然后访问 <code>http://127.0.0.1:8080/docs.html</code>。<br>' +
            '或手动运行：<br>' +
            '<code>python -m http.server 8080 --directory "D:\\Users\\User\\pet-lab"</code><br>' +
            '然后访问 <code>http://127.0.0.1:8080/docs.html</code>。<br>' +
            '<small style="color:#8b97a8">' + e.message + '</small></div>';
    }
}

let currentDoc = null;

window.addEventListener('load', function () {
    if (window.PetI18n) {
        PetI18n.onChange(function () {
            if (currentDoc) load(currentDoc);
        });
    }
});

const f = new URLSearchParams(location.search).get('f') || 'README.md';
currentDoc = FILES.includes(f) ? f : 'README.md';
load(currentDoc);
</script>
<script src="assets/i18n.js"></script>
