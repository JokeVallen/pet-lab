<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
<title>文案编辑</title>
<style>
    :root { color-scheme: light; --line:#e3e9f3; --ink:#1f2a37; --muted:#7b8798; --brand:#2f6fed; }
    * { box-sizing: border-box; }
    body { margin:0; background:#f6f8fc; color:var(--ink); font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    header {
        position: sticky; top: 0; z-index: 20; background: #fff;
        border-bottom: 1px solid var(--line); padding: 10px 22px;
        display: flex; align-items: center; gap: 10px;
    }
    header h1 { font-size: 15px; margin: 0; }
    header .status { flex: 1; font-size: 12.5px; color: var(--muted); }
    button, .btn {
        font: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer;
        border: 1px solid var(--line); background: #f7f9fd; border-radius: 8px; color: var(--ink);
        text-decoration: none; display: inline-block; line-height: 1.4;
    }
    button:hover, .btn:hover { background: #eef3fc; }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    button.primary:hover { background: #2a63d6; }
    .i18n-btn { margin-left: 2px; }

    main { max-width: 1040px; margin: 0 auto; padding: 20px 22px 90px; }
    .group { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px 6px; margin:0 0 16px; }
    .group > h2 { font-size:15px; margin:0 0 2px; }
    .group > .gdesc { margin:0 0 14px; color:var(--muted); font-size:12.5px; }

    /* 每条文案：独立卡片 + 左侧色条，避免连成一片 */
    .slot {
        border:1px solid #edf1f8; border-left:3px solid #c8d8f5;
        border-radius:10px; padding:10px 14px 12px; margin:0 0 12px; background:#fcfdff;
    }
    .slot:last-child { margin-bottom: 14px; }
    .slot > label { display:block; font-size:13px; font-weight:600; margin:0 0 2px; }
    .slot > .hint { font-size:12px; color:var(--muted); margin:0 0 6px; }
    .slot textarea {
        width:100%; min-height:58px; padding:8px 10px; border:1px solid var(--line);
        border-radius:8px; font:13.5px/1.75 inherit; resize:vertical; color:var(--ink); background:#fff;
    }
    .slot textarea:focus { outline:2px solid #dbe7fb; border-color:#b9cdf0; }
    .preview { margin-top:5px; font-size:12.5px; color:#8b97a8; white-space:pre-wrap; }
    .preview b { color:#5b6b80; font-weight:600; }

    /* 变量面板：默认折叠，插入时展开 */
    .palette { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 16px; margin:0 0 16px; }
    .palette > summary { cursor:pointer; font-size:13.5px; font-weight:600; list-style:none; }
    .palette > summary::-webkit-details-marker { display:none; }
    .palette > summary::before { content:'▸ '; color:#9aa7b8; }
    .palette[open] > summary::before { content:'▾ '; }
    .palette .phint { margin:8px 0 0; font-size:12.5px; color:#6b7789; }
    .palette .pgroup { margin-top:10px; }
    .palette .pgroup > span { font-size:12px; color:#8494a8; display:block; margin-bottom:4px; }
    .chips { display:flex; gap:6px; flex-wrap:wrap; }
    .chips button { padding:2px 8px; font-size:12px; color:#4a6fa5; border-color:#dbe7fb; background:#f7faff; }
    .snippets { margin-top:12px; padding-top:10px; border-top:1px dashed #e8edf6; }

    .legal { margin-top:36px; padding-top:18px; border-top:1px solid var(--line); font-size:12.5px; line-height:1.75; color:#6b7789; }
    .legal-sec { margin-bottom:12px; }
    .legal h3 { font-size:12.5px; margin:0 0 4px; color:#48566a; font-weight:600; }
    .legal p { margin:0; }
</style>
</head>
<body data-title-key="copy.title" data-help-key="copy">
<header>
    <h1 data-i18n="copy.title">文案编辑</h1>
    <span class="status" id="status" data-i18n="copy.loading">加载中…</span>
    <a class="btn" href="vars.html" data-i18n="copy.varsBtn">变量表</a>
    <button type="button" onclick="document.getElementById('file').click()" data-i18n="copy.import">导入 YAML</button>
    <input type="file" id="file" accept=".yaml,.yml" hidden>
    <button type="button" onclick="download()" data-i18n="copy.export">导出 YAML</button>
    <button type="button" class="primary" onclick="saveCopy()" data-i18n="copy.save">保存并编译</button>
</header>

<main>
    <details class="palette" id="palette">
        <summary data-i18n="copy.palette">插入变量</summary>
        <p class="phint" data-i18n="copy.paletteHint">先点一个输入框，再点变量名，它会插到光标处。条件写法：{tag?'有标签':'没标签'}、{tag??'没标签'}、{!tag?'没标签':'有标签'}。</p>
        <div id="paletteBody"></div>
        <div class="snippets">
            <span class="chips" id="snips"></span>
        </div>
    </details>

    <div id="slots"></div>

    <footer class="legal">
        <div class="legal-sec">
            <h3 data-i18n="legal.privacy">隐私</h3>
            <p data-i18n="legal.privacyBody">本工具完全在你的浏览器本地运行：所有文件读取、编辑与编译都在本机完成，不会上传任何内容，也不含统计或追踪脚本。语言偏好保存在浏览器 localStorage 中，可随时清除站点数据移除。</p>
        </div>
        <div class="legal-sec">
            <h3 data-i18n="legal.disclaimer">免责声明</h3>
            <p data-i18n="legal.disclaimerBody">本工具按“现状”提供，不保证适用于任何特定用途。配置由你自行编辑、编译与应用，由此产生的任何后果由使用者承担；作者不对数据丢失、站点异常或任何间接损失负责。使用前请自行备份配置文件。</p>
        </div>
    </footer>
</main>

<script>
const T = (spec) => (spec && typeof spec === 'object' ? (spec[PetI18n.lang] || spec.zh) : spec);
/* ---------- 本地服务探测 ----------
 * 写盘与编译只有本地服务提供；探不到就整段跳过，不逐个接口撞 404。 */
let SERVER_OK = null;
let SERVER_WHY = '';           /* 探测失败的原因，显示在提示里，便于排查 */
async function probeOnce(method) {
    const r = await fetch('/api/version', { cache: 'no-store', method: method });
    return r.ok;
}
async function hasServer() {
    if (SERVER_OK !== null) return SERVER_OK;
    /* HEAD 可能落到正在关闭的 keep-alive 连接上，或撞上服务刚启动的瞬间。
     * 因此：失败重试两次（间隔 150ms），HEAD 不行再回退 GET。
     * 只有三种都失败才认定「没有服务」——避免误报。 */
    const attempts = [
        ['HEAD', 0], ['HEAD', 150], ['GET', 0], ['GET', 300]
    ];
    for (let i = 0; i < attempts.length; i += 1) {
        const method = attempts[i][0];
        const wait = attempts[i][1];
        if (wait) await new Promise(function (r) { setTimeout(r, wait); });
        try {
            if (await probeOnce(method)) {
                SERVER_OK = true;
                SERVER_WHY = '';
                return true;
            }
            SERVER_WHY = 'HTTP ' + method + ' 未返回成功';
        } catch (e) {
            SERVER_WHY = (e && e.message) || 'net error';
        }
    }
    SERVER_OK = false;
    noteNoServer();
    return false;
}
function noteNoServer() {
    if (document.getElementById('noServerNote')) return;
    const d = document.createElement('div');
    d.id = 'noServerNote';
    d.textContent = T('未连接本地服务：写盘与编译不可用，可继续导出 YAML。') + (SERVER_WHY ? ' (' + SERVER_WHY + ')' : '');

    d.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:200;' +
        'background:#1f2a37;color:#fff;font:12.5px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;' +
        'padding:7px 14px;border-radius:18px;box-shadow:0 6px 20px rgba(20,40,80,.25)';
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 6000);
}

/* ---------- 写盘授权 ---------- */
let writeAllowed = null;
function ensureWriteAllowed() {
    if (writeAllowed !== null) return Promise.resolve(writeAllowed);
    const ask = (typeof PetI18n !== 'undefined') ? PetI18n.s('legal.writeAsk') : 'Allow writing to local files?';
    writeAllowed = window.confirm(ask);
    return Promise.resolve(writeAllowed);
}
</script>
<script src="assets/i18n.js"></script>
<script src="vendor/js-yaml.min.js"></script>
<script src="assets/vars.js"></script>
<script>
/* ---------- 文案槽位 ----------
 * multi = true 表示是字符串数组，一行一条。 */
const GROUPS = [
    {
        id: 'meet', label: { zh: '见面', en: 'Meeting' },
        desc: { zh: '第一次见面、再次见面、连续来访。', en: 'First visit, return visits, streaks.' },
        slots: [
            { key: 'firstMeet', label: { zh: '初次见面', en: 'First meeting' }, hint: { zh: '第一次打开页面时', en: 'First time on the page' } },
            { key: 'again', label: { zh: '再次见面', en: 'Meeting again' }, hint: { zh: '之后每次回来', en: 'Every later visit' } },
            { key: 'streak3', label: { zh: '连续 3 天', en: '3-day streak' }, hint: { zh: '{n} 会替换成天数', en: '{n} becomes the day count' } },
            { key: 'streak7', label: { zh: '连续 7 天', en: '7-day streak' }, hint: { zh: '{n} 会替换成天数', en: '{n} becomes the day count' } }
        ]
    },
    {
        id: 'talk', label: { zh: '对话', en: 'Talking' },
        desc: { zh: '打开对话框时说的话。', en: 'What she says when the chat opens.' },
        slots: [
            { key: 'about', label: { zh: '自我介绍', en: 'Self-introduction' }, hint: { zh: '打开对话框的第一句', en: 'First line in the chat' } },
            { key: 'back', label: { zh: '被召回', en: 'Brought back' }, hint: { zh: '点了「召回」之后', en: 'After “bring back”' } }
        ]
    },
    {
        id: 'state', label: { zh: '状态', en: 'States' },
        desc: { zh: '睡觉这类状态下的描述句。', en: 'Lines for states such as sleeping.' },
        slots: [
            { key: 'sleep', label: { zh: '睡着了', en: 'Asleep' }, hint: { zh: '长时间没操作时', en: 'After a long idle' } }
        ]
    },
    {
        id: 'act', label: { zh: '互动', en: 'Interaction' },
        desc: { zh: '投喂、问候。数组型可以写多条，随机说一条。', en: 'Feeding and greetings. Arrays pick one at random.' },
        slots: [
            { key: 'feed', label: { zh: '投喂', en: 'Fed' }, hint: { zh: '一行一条，随机说', en: 'One per line, picked at random' }, multi: true },
            { key: 'greet.late', label: { zh: '问候 · 深夜', en: 'Greeting · late' }, hint: { zh: '一行一条', en: 'One per line' }, multi: true },
            { key: 'greet.morning', label: { zh: '问候 · 早上', en: 'Greeting · morning' }, hint: { zh: '一行一条', en: 'One per line' }, multi: true },
            { key: 'greet.afternoon', label: { zh: '问候 · 下午', en: 'Greeting · afternoon' }, hint: { zh: '一行一条', en: 'One per line' }, multi: true },
            { key: 'greet.evening', label: { zh: '问候 · 晚上', en: 'Greeting · evening' }, hint: { zh: '一行一条', en: 'One per line' }, multi: true }
        ]
    }
];

const VAR_LIST = (window.PetVars && PetVars.list) || [];

/* TT：普通中文字符串 → 当前语言（走字典），给界面文案用 */
const TT = (s) => (s == null ? s : (window.PetI18n ? PetI18n.t(String(s)) : s));

let lastArea = null;       // 最近聚焦的文本框：变量插到这儿
let persona = {};          // 配置里的 persona 原样
let baseHash = null;       // 打开文件时的 sha1
let loadedName = '';

/* 编辑哪种语言由右上角语言按钮决定：中文编辑 persona.*，英文编辑 persona.en.* */
const editLang = () => (PetI18n.lang === 'en' ? 'en' : 'zh');

/* ---------- 取值 / 赋值 ---------- */

function readPath(obj, path) {
    let cur = obj;
    for (const k of path.split('.')) {
        if (cur == null) return undefined;
        cur = cur[k];
    }
    return cur;
}

function writePath(obj, path, value) {
    const parts = path.split('.');
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i += 1) {
        cur[parts[i]] = cur[parts[i]] || {};
        cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = value;
}

function getValue(key) {
    return editLang() === 'zh' ? readPath(persona, key) : readPath(persona, 'en.' + key);
}

function setValue(key, value) {
    if (editLang() === 'zh') writePath(persona, key, value);
    else writePath(persona, 'en.' + key, value);
}

/* ---------- 占位符 ---------- */

/* 示例值：名字取真实配置，其余用变量表里的示例，时间取当下 */
function vars() {
    const now = new Date();
    const two = (x) => (x < 10 ? '0' : '') + x;
    const out = {};
    for (const v of VAR_LIST) out[v.key] = PetVars.text(v, 'ex', PetI18n.lang);
    out.pet = persona.name || '';
    out.alt = persona.alt || persona.name || '';
    out.hour = now.getHours();
    out.time = two(now.getHours()) + ':' + two(now.getMinutes());
    out.date = now.getFullYear() + '-' + two(now.getMonth() + 1) + '-' + two(now.getDate());
    out.pageName = PetI18n.lang === 'en' ? 'article' : '文章';
    return out;
}
window.__copyVars = vars;

/* 表达式实现来自 js/pet/content/expr.js（模块异步载入，未就绪时退化成简单替换） */
function fill(text, extra) {
    if (window.PetFill) return window.PetFill(text, extra);
    const merged = Object.assign({}, vars(), extra || {});
    return String(text == null ? '' : text).replace(/\{(\w+)\}/g, (m, k) =>
        Object.prototype.hasOwnProperty.call(merged, k) ? String(merged[k]) : m);
}

/* ---------- 渲染 ---------- */

function render() {
    const host = document.getElementById('slots');
    host.textContent = '';
    for (const g of GROUPS) {
        const box = document.createElement('section');
        box.className = 'group';
        const h = document.createElement('h2');
        h.textContent = T(g.label);
        const p = document.createElement('p');
        p.className = 'gdesc';
        p.textContent = T(g.desc);
        box.append(h, p);
        for (const s of g.slots) box.appendChild(slotEl(s));
        host.appendChild(box);
    }
    renderPalette();
    renderSnips();
    updateStatus();
}

function slotEl(spec) {
    const wrap = document.createElement('div');
    wrap.className = 'slot';

    const label = document.createElement('label');
    label.textContent = T(spec.label);
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = T(spec.hint);

    const ta = document.createElement('textarea');
    ta.rows = spec.multi ? 4 : 2;
    const cur = getValue(spec.key);
    if (Array.isArray(cur)) ta.value = cur.join('\n');
    else if (cur != null) ta.value = String(cur);
    ta.placeholder = PetI18n.lang === 'en' ? 'Empty = use the built-in default' : '（留空则用内置默认文案）';

    const preview = document.createElement('div');
    preview.className = 'preview';
    const refresh = () => {
        const raw = spec.multi ? ta.value.split('\n').filter((x) => x.trim()) : ta.value;
        const shown = Array.isArray(raw) ? raw.map((x) => fill(x)).join('\n') : fill(raw);
        preview.innerHTML = '';
        const tag = document.createElement('b');
        tag.textContent = PetI18n.lang === 'zh' ? T('预览：') : 'Preview: ';
        preview.append(tag, document.createTextNode(shown || (PetI18n.lang === 'zh' ? T('（空，使用默认）') : '(empty, default used)')));
    };

    ta.addEventListener('focus', () => { lastArea = ta; });
    ta.addEventListener('input', () => {
        if (spec.multi) {
            const arr = ta.value.split('\n').filter((x) => x.trim() !== '');
            setValue(spec.key, arr.length ? arr : null);
        } else {
            setValue(spec.key, ta.value.trim() === '' ? null : ta.value);
        }
        refresh();
    });
    refresh();

    wrap.append(label, hint, ta, preview);
    return wrap;
}

/* ---------- 变量面板 ---------- */

function insertAt(token, area) {
    const ta = area || lastArea;
    if (!ta) {
        setStatus(PetI18n.lang === 'zh' ? T('先点一个输入框，再插变量') : 'Click a field first');
        document.getElementById('palette').open = true;
        return;
    }
    const start = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
    const end = ta.selectionEnd != null ? ta.selectionEnd : ta.value.length;
    ta.value = ta.value.slice(0, start) + token + ta.value.slice(end);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = start + token.length;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
}

function chipButton(text, title, token) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    b.title = title;
    b.addEventListener('click', () => insertAt(token));
    return b;
}

function renderPalette() {
    const host = document.getElementById('paletteBody');
    if (!host) return;
    host.textContent = '';

    for (const g of (window.PetVars ? PetVars.groups : [])) {
        const items = VAR_LIST.filter((v) => v.group === g.id);
        if (!items.length) continue;
        const box = document.createElement('div');
        box.className = 'pgroup';
        const name = document.createElement('span');
        name.textContent = PetI18n.lang === 'en' ? g.en : g.zh;
        const chips = document.createElement('div');
        chips.className = 'chips';
        for (const v of items) {
            chips.appendChild(chipButton(
                '{' + v.key + '}',
                PetVars.text(v, 'zh', PetI18n.lang) + ' · ' + PetVars.text(v, 'ex', PetI18n.lang),
                '{' + v.key + '}'
            ));
        }
        box.append(name, chips);
        host.appendChild(box);
    }
}

const SNIPPETS = [
    { code: "{title?'读《{title}》':'随便逛逛'}", codeEn: "{title?'Reading {title}':'Just browsing'}", zh: '有标题说标题', en: 'title when present' },
    { code: "{tag?'在翻{tag}':'这页没标签'}", codeEn: "{tag?'Browsing {tag}':'No tag here'}", zh: '有标签说标签', en: 'tag when present' },
    { code: "{comments??'还没有评论'}", codeEn: "{comments??'No comments yet'}", zh: '没有评论时', en: 'when no comments' },
    { code: "{!title?'还没打开文章':'正在读{title}'}", codeEn: "{!title?'No article open':'Reading {title}'}", zh: '取反', en: 'negated' }
];

function renderSnips() {
    const host = document.getElementById('snips');
    if (!host) return;
    host.textContent = '';
    for (const s of SNIPPETS) {
        /* 按钮上的示例按界面语言切换；插入的 token 永远是原样的表达式 */
        const code = PetI18n.lang === 'en' ? (s.codeEn || s.code) : s.code;
        host.appendChild(chipButton(code, PetI18n.lang === 'en' ? s.en : s.zh, s.code));
    }
}

function updateStatus() {
    const el = document.getElementById('status');
    if (!el) return;
    if (!loadedName) return;
    const langName = PetI18n.lang === 'en' ? 'Chinese' : '中文';   /* 指的是「正在编辑哪一层文案」 */
    el.textContent = (PetI18n.lang === 'zh' ? T('正在编辑 ') + langName + T(' 文案 · ') : 'Editing ' + langName + ' copy · ') + loadedName;
}

function setStatus(s) {
    document.getElementById('status').textContent = s;
}

/* ---------- 载入 / 保存 ---------- */

async function sha1(text) {
    const buf = new TextEncoder().encode(text);
    const h = await crypto.subtle.digest('SHA-1', buf);
    return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function loadYamlText(text, name) {
    const data = jsyaml.load(text);
    persona = (data && data.persona) || {};
    baseHash = await sha1(text);
    loadedName = name;
    render();
}

async function boot() {
    try {
        const r = await fetch('config/pet.yaml?ts=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const text = new TextDecoder('utf-8').decode(await r.arrayBuffer());
        await loadYamlText(text, 'config/pet.yaml');
    } catch (e) {
        setStatus((PetI18n.lang === 'zh' ? T('读不到 config/pet.yaml：') : 'Cannot read config/pet.yaml: ') + e.message);
        render();
    }
}

/* 只把当前语言下的键发给 apply-patch */
function buildPatch() {
    const out = {};
    const prefix = editLang() === 'zh' ? '' : 'en.';
    for (const g of GROUPS) {
        for (const s of g.slots) {
            const v = getValue(s.key);
            if (v === undefined) continue;
            out[prefix + s.key] = v;
        }
    }
    return out;
}

async function saveCopy() {
    if (!(await hasServer())) return;
    if (!(await ensureWriteAllowed())) return;
    setStatus(PetI18n.lang === 'zh' ? T('正在保存…') : 'Saving…');
    try {
        const res = await fetch('/api/patch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ patch: Object.assign({ personaCopy: buildPatch() }, await petTarget()) })
        });
        const data = await res.json();
        if (data.ok) {
            try { localStorage.setItem('pet-config-ts', String(Date.now())); } catch (e) { /* ignore */ }
            setStatus(PetI18n.lang === 'zh' ? T('已保存，配置已重新编译') : 'Saved and rebuilt');
        } else {
            setStatus((PetI18n.lang === 'zh' ? T('保存失败：') : 'Save failed: ') + (data.error || data.stderr || '').slice(0, 120));
        }
    } catch (e) {
        setStatus(PetI18n.lang === 'zh' ? T('需要本地服务器') : 'Needs the local server');
    }
}

function toYaml() {
    return jsyaml.dump({ persona: persona }, { lineWidth: 120, noRefs: true, allowUnicode: true });
}

function download() {
    const blob = new Blob([toYaml()], { type: 'text/yaml;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'persona.yaml';
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus(PetI18n.lang === 'zh' ? T('已导出 persona.yaml') : 'Exported persona.yaml');
}

document.getElementById('file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => loadYamlText(String(reader.result), f.name);
    reader.readAsText(f);
});

/* 语言切换：重渲染（值存在 persona 里，不会丢） */
PetI18n.onChange(() => render());

boot();
/* 多宠物合集：配置是多只时，补丁要指明改哪一只 */
async function petTarget() {
    try {
        const r = await fetch('config/pet.yaml?ts=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return {};
        const text = await r.text();
        const d = window.jsyaml ? window.jsyaml.load(text) : JSON.parse(text);
        if (!d || !Array.isArray(d.pets)) return {};
        return { pet: d.active || (d.pets[0] && d.pets[0].id) };
    } catch (e) { return {}; }
}

</script>
<script type="module">
/* 只取表达式引擎，不碰宠物入口：导入 js/pet/index.js 会顺带把宠物挂载到页面上 */
import { makeFill } from './js/pet/content/expr.js';
window.PetFill = makeFill(() => window.__copyVars());
/* 表达式引擎就绪后重渲一次预览 */
if (window.PetI18n) window.dispatchEvent(new Event('petfill:ready'));
</script>
<script>
window.addEventListener('petfill:ready', () => { try { render(); } catch (e) { /* ignore */ } });
</script>
